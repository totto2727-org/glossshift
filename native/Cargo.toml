[package]
name = "glossshift"
version = "0.2.0"
edition = "2024"
description = "A macOS NSH popup with application-owned local translation"
license = "MIT"
repository = "https://github.com/totto2727-org/glossshift"
homepage = "https://github.com/totto2727-org/glossshift"

[dependencies]
accessibility = "0.2.0"
anyhow = "1.0"
async-channel = "2.5"
clap = { version = "4.5", features = ["derive"] }
core-foundation = "0.10"
core-graphics = "0.24.0"
global-hotkey = { version = "0.8.0", features = ["serde"] }
libc = "0.2"
macos-accessibility-client = "0.0.2"
dispatch2 = "0.3"
nsh-core = { path = "../.nsh/upstream/crates/nsh-core", version = "0.5.0" }
nsh-platform-macos = { path = "../.nsh/upstream/crates/nsh-platform-macos", version = "0.5.0" }
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "NSApplication",
  "NSWindow",
  "NSPasteboard",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSArray"] }
plist = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
tray-icon = { version = "0.24.2", default-features = false }
uuid = { version = "1", features = ["v4"] }
xdg = "3.0.0"

[dev-dependencies]
nsh-core = { path = "../.nsh/upstream/crates/nsh-core", version = "0.5.0", features = ["declarations"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
