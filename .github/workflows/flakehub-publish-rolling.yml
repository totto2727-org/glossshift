name: Publish every Git push to main to FlakeHub

on:
  push:
    branches:
      - main

jobs:
  flakehub-publish:
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          prepare-dev-shell: 'false'
      - uses: totto2727-org/monorepo/.github/actions/publish-flakehub@main
