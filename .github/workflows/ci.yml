name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          prepare-dev-shell: 'false'
      - name: Check Rust formatting without building the application
        run: nix shell --inputs-from . nixpkgs#cargo nixpkgs#rustfmt --command cargo fmt --all --check
      - name: Check Nix outputs for the current runner without building
        run: nix flake check --no-build
