[package]
name = "glossshift"
version = "0.1.0"
edition = "2024"
description = "A macOS GPUI popup and CLI for streaming translations through OpenAI-compatible APIs"
license = "MIT"
repository = "https://github.com/totto2727-org/glossshift"
homepage = "https://github.com/totto2727-org/glossshift"

[dependencies]
accessibility = "0.2.0"
anyhow = "1.0"
async-channel = "2.5"
clap = { version = "4.5", features = ["derive"] }
core-foundation = "0.10"
core-graphics = "0.24.0"
futures = "0.3"
global-hotkey = { version = "0.8.0", features = ["serde"] }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
libc = "0.2"
macos-accessibility-client = "0.0.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
rig = "0.41.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
tree-sitter-highlight = "0.26"
tree-sitter-md = "0.5"
xdg = "3.0.0"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
