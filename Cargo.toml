[package]
name = "glossshift"
version = "0.2.0"
edition = "2024"
description = "A macOS zgui popup and CLI for streaming translations through OpenAI-compatible APIs"
license = "MIT"
repository = "https://github.com/totto2727-org/glossshift"
homepage = "https://github.com/totto2727-org/glossshift"

[dependencies]
llm-profiles = { version = "0.1.0", features = ["rig"] }
accessibility = "0.2.0"
anyhow = "1.0"
async-channel = "2.5"
clap = { version = "4.5", features = ["derive"] }
core-foundation = "0.10"
core-graphics = "0.24.0"
futures = "0.3"
global-hotkey = { version = "0.8.0", features = ["serde"] }
libc = "0.2"
macos-accessibility-client = "0.0.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
plist = "1"
rig = "0.41.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
tray-icon = { version = "0.24.2", default-features = false }
tree-sitter-highlight = "0.26"
tree-sitter-md = "0.5"
uuid = { version = "1", features = ["v4"] }
winit = "0.30.13"
xdg = "3.0.0"
zgui = { version = "0.1.0", features = ["tokio"] }
zgui-platform-winit = "0.1.0"
zgui-ui = "0.1.0"
zgui-ui-icons = "0.1.0"
zgui-ui-tokens = "0.1.0"

[dev-dependencies]
zgui-dom = "0.1.0"
zgui-platform-headless = "0.1.0"
zgui-testkit-view = "0.1.0"
zgui-view-dom = "0.1.0"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
