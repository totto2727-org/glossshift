[package]
name = "translate-popup"
version = "0.1.0"
edition = "2024"
description = "A macOS global-shortcut translation popup built with GPUI and Rig"
license = "MIT"

[dependencies]
accessibility = "0.2.0"
anyhow = "1.0"
async-channel = "2.5"
core-foundation = "0.10"
futures = "0.3"
global-hotkey = { version = "0.8.0", features = ["serde"] }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
macos-accessibility-client = "0.0.2"
rig = "0.41.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
toml = "0.9"
xdg = "3.0.0"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
